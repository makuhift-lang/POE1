name: Java CI with Maven

on:
  push:
    branches: [ "KhanbanTasks", "master" ]
  pull_request:
    branches: [ "KhanbanTasks", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build and Run Automated Tests
      run: mvn -B test
